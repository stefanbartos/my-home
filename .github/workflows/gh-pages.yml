name: GitHub Pages with Astro

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  # Build pull requests too, so a broken build is caught before merging.
  # The deploy step below only runs on pushes to main.
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # A newer push to the same branch makes the running build obsolete.
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        # Only deploy on pushes to main, never from pull requests.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
