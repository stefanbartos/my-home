name: Workflow security

# Static analysis of the workflows and Dependabot config with zizmor.
# Findings appear in the Security tab and on the pull request diff.
on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload findings to code scanning.
      security-events: write
      # Needed by the SARIF upload in private repos; harmless in public ones.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Pin the tool too, so a new release can't change what runs here.
          version: 1.32.0
