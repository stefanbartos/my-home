name: GitHub Pages with Astro

on:
  push:
    branches:
      - main
  # Build pull requests too, so a broken build is caught before merging.
  # Only pushes to main (and manual runs on main) deploy.
  pull_request:
    branches:
      - main
  # Allow a manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      # A newer push to a PR makes its running build obsolete.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps run third-party code; keep the token out of reach.
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On failure, format the files and print the diff so the log shows
      # what needs to change.
      - name: Check formatting
        run: npm run format:check || { npm run format >/dev/null; git --no-pager diff; exit 1; }

      # Bugs and suspicious patterns in JS/TS and Astro scripts.
      - name: Lint with oxlint
        run: npm run lint

      # Unused files, exports and dependencies, duplication and complexity.
      - name: Check code with fallow
        run: npm run lint:fallow

      # Unit tests (Vitest) for the helper functions in src/utils.
      - name: Run unit tests
        run: npm test

      # Astro keeps optimized images in node_modules/.astro. Restoring it skips
      # re-processing photos that have not changed. It must come after npm ci,
      # which wipes node_modules.
      # The key covers everything that decides which variants get generated
      # (components and pages pick sizes and formats, not just the photos), so
      # a change there saves a fresh cache. Otherwise the old key keeps hitting,
      # the cache is never re-saved and the new variants are re-encoded on
      # every run.
      - name: Cache optimized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-

      - name: Build
        run: npm run build

      # Pages serves the site under /my-home/. Mirror that layout so the link
      # checker can resolve root-relative links like /my-home/sci/.
      - name: Prepare site for link check
        run: mkdir -p "$RUNNER_TEMP/site" && cp -R dist "$RUNNER_TEMP/site/my-home"

      # Broken internal links and #anchors fail the build. External links are
      # checked weekly by links.yml instead, so a flaky site can't block a PR.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --offline
            --include-fragments
            --no-progress
            --root-dir ${{ runner.temp }}/site
            '${{ runner.temp }}/site/my-home/**/*.html'
          # Pin the tool too, so a new release can't change what runs here.
          lycheeVersion: v0.24.2

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    # Never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; never cancel one halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
