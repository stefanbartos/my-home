name: GitHub Pages with Astro

on:
  push:
    branches:
      - main
  # Build pull requests too, so a broken build is caught before merging.
  # Only pushes to main (and manual runs on main) deploy.
  pull_request:
    branches:
      - main
  # Allow a manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      # A newer push to a PR makes its running build obsolete.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On failure, format the files and print the diff so the log shows
      # what needs to change.
      - name: Check formatting
        run: npm run format:check || { npm run format >/dev/null; git --no-pager diff; exit 1; }

      # Astro keeps optimized images in node_modules/.astro. Restoring it skips
      # re-processing photos that have not changed. It must come after npm ci,
      # which wipes node_modules.
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-

      - name: Build
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    # Never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; never cancel one halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
