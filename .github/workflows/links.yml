name: External links

# Checks every external link on the built site once a week, so links to
# PDFs, videos and other sites that have gone dead show up. A failed run
# sends the usual GitHub Actions failure email. Internal links are checked
# on every build by pages.yml.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same cache as pages.yml, so photos aren't re-encoded here.
      - name: Cache optimized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-

      - name: Build
        run: npm run build

      # Pages serves the site under /my-home/. Mirror that layout so the link
      # checker can resolve root-relative links like /my-home/sci/.
      - name: Prepare site for link check
        run: mkdir -p "$RUNNER_TEMP/site" && cp -R dist "$RUNNER_TEMP/site/my-home"

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --root-dir ${{ runner.temp }}/site
            '${{ runner.temp }}/site/my-home/**/*.html'
          # Pin the tool too, so a new release can't change what runs here.
          lycheeVersion: v0.24.2
