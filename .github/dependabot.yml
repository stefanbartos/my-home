version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version
    # is likely caught and pulled first.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version
    # is likely caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # TypeScript 7 is the native (Go) rewrite; stay on 6.x until the
      # tooling (astro check) supports it.
      - dependency-name: "typescript"
        versions: [">=7"]
